<!DOCTYPE html>
<html lang="ja">
<head>
  <title>名言集</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrapper">
    <h1>名言集</h1>
    <div class="left-box">
      <figure>
        <img src="images/disney.jpg" alt="ウォルト・ディズニー">
        <figcaption>ウォルト・ディズニー</figcaption>
      </figure>
      <p>
        「すべての夢は叶います。追いかける勇気があるなら」
      </p>
    </div>

    <div class="right-box">
      <figure>
        <img src="images/mandela.jpg" alt="ネルソン・マンデラ">
        <figcaption>ネルソン・マンデラ</figcaption>
      </figure>
      <p>
        「私は負けるということは決してない。勝つか学ぶかだ」
      </p>
    </div>

    <div class="center-box">
      <figure>
        <img src="images/eliot.jpg" alt="ジョージ・エリオット">
        <figcaption>ジョージ・エリオット</figcaption>
      </figure>
      <p>
        「なりたかった自分になるのに遅すぎるということはない」
      </p>
    </div>
  </div>
</body>
</html>
